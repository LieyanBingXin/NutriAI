<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriAI - 智能营养推荐</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">🍎</span>
            <span class="brand-name">NutriAI</span>
        </div>
        <div class="nav-actions" id="navActions">
            <button class="btn-ghost" onclick="openAuthModal('login')">登录</button>
            <button class="btn-ghost btn-ghost-primary" onclick="openAuthModal('register')">注册</button>
        </div>
    </nav>

    <header class="header">
        <h1>智能营养推荐</h1>
        <p class="subtitle">AI 驱动的个性化饮食与食谱推荐</p>
    </header>

    <main class="container">
        <section class="form-section">
            <div class="section-header">
                <h2>填写您的信息</h2>
                <button class="btn-link" id="saveProfileBtn" style="display:none;">💾 保存为我的画像</button>
            </div>

            <form id="profileForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>性别</label>
                        <select name="gender" required>
                            <option value="MALE">男</option>
                            <option value="FEMALE">女</option>
                            <option value="OTHER">其他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>年龄</label>
                        <input type="number" name="age" min="1" max="150" value="25" required>
                    </div>

                    <div class="form-group">
                        <label>身高 (cm)</label>
                        <input type="number" name="heightCm" step="0.1" min="30" max="250" value="170" required>
                    </div>

                    <div class="form-group">
                        <label>体重 (kg)</label>
                        <input type="number" name="weightKg" step="0.1" min="2" max="300" value="65" required>
                    </div>

                    <div class="form-group">
                        <label>活动水平</label>
                        <select name="activityLevel">
                            <option value="SEDENTARY">久坐</option>
                            <option value="LIGHT">轻度活动</option>
                            <option value="MODERATE" selected>中度活动</option>
                            <option value="ACTIVE">活跃</option>
                            <option value="VERY_ACTIVE">非常活跃</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>健康目标</label>
                        <select name="healthGoal">
                            <option value="LOSE_WEIGHT">减脂</option>
                            <option value="MAINTAIN" selected>维持</option>
                            <option value="GAIN_WEIGHT">增重</option>
                            <option value="BUILD_MUSCLE">增肌</option>
                            <option value="IMPROVE_HEALTH">改善健康</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>口味偏好</label>
                        <select name="tastePreference">
                            <option value="LIGHT">清淡</option>
                            <option value="SALTY">咸鲜</option>
                            <option value="SPICY">辛辣</option>
                            <option value="SWEET">甜食</option>
                            <option value="SOUR">酸味</option>
                            <option value="UMAMI">鲜香</option>
                            <option value="MIXED" selected>混合</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>食物喜好 (逗号分隔)</label>
                    <input type="text" id="foodPrefs" placeholder="例如: 鸡肉, 米饭, 西兰花">
                </div>

                <div class="form-group full-width">
                    <label>食物忌讳 / 过敏 (逗号分隔)</label>
                    <input type="text" id="foodAllergies" placeholder="例如: 花生, 海鲜">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="submitBtn">✨ 生成推荐</button>
                    <button type="reset" class="btn-secondary">重置</button>
                </div>
            </form>
        </section>

        <section class="result-section" id="resultSection" style="display:none;">
            <div class="result-header">
                <h2>推荐结果</h2>
                <span class="ai-badge" id="aiBadge"></span>
            </div>

            <div class="summary-card" id="summaryCard"></div>

            <div class="nutrition-card" id="nutritionCard"></div>

            <div class="recipes-container" id="recipesContainer"></div>

            <div class="tips-card" id="tipsCard"></div>
        </section>

        <section class="history-section" id="historySection" style="display:none;">
            <div class="section-header">
                <h2>📚 我的推荐历史</h2>
                <div class="history-pagination" id="historyPagination"></div>
            </div>
            <div class="history-list" id="historyList"></div>
        </section>
    </main>

    <div id="authModal" class="modal" style="display:none;">
        <div class="modal-backdrop" onclick="closeAuthModal()"></div>
        <div class="modal-content">
            <button class="modal-close" onclick="closeAuthModal()">✕</button>
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="login" onclick="switchAuthTab('login')">登录</button>
                <button class="modal-tab" data-tab="register" onclick="switchAuthTab('register')">注册</button>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary btn-full">登录</button>
                <div class="form-error" id="loginError"></div>
            </form>
            <form id="registerForm" class="auth-form" style="display:none;">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" name="username" required minlength="3" maxlength="50">
                </div>
                <div class="form-group">
                    <label>邮箱 (可选)</label>
                    <input type="email" name="email">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" required minlength="6">
                </div>
                <button type="submit" class="btn-primary btn-full">注册</button>
                <div class="form-error" id="registerError"></div>
            </form>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
        <div class="spinner"></div>
        <p>AI 正在分析您的信息...</p>
    </div>

    <div id="toast" class="toast" style="display:none;"></div>

    <footer class="footer">
        <p>NutriAI · 数据仅供参考，具体饮食建议请咨询专业医生或营养师</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>

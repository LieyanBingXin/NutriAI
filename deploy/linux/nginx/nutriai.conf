# NutriAI — Nginx 反向代理（Docker Compose）
# 首次使用：把 nutri.example.com 替换为你的域名；HTTP 可先跑通，再启用 HTTPS。

limit_req_zone $binary_remote_addr zone=nutriai_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nutriai_api:10m rate=30r/s;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

upstream nutriai_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Let's Encrypt HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 登录接口限流，防暴力破解
    location = /api/auth/login {
        limit_req zone=nutriai_login burst=5 nodelay;
        proxy_pass http://nutriai_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE / 流式接口：关闭缓冲，延长超时
    location /api/ {
        limit_req zone=nutriai_api burst=60 nodelay;
        proxy_pass http://nutriai_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service Worker 不缓存，保证更新
    location = /sw.js {
        proxy_pass http://nutriai_app;
        expires -1;
    }

    location = /index.html {
        proxy_pass http://nutriai_app;
        expires -1;
    }

    location ~* \.(?:css|js|png|svg|webp|ico|woff2?)$ {
        proxy_pass http://nutriai_app;
        expires 7d;
    }

    location / {
        proxy_pass http://nutriai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


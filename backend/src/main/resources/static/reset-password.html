<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>重置密码 · NutriAI</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --primary: #12b76a;
            --primary-strong: #0c9a58;
            --ink: #0b1f1a;
            --muted: #6b7f77;
            --bg: #f3f7f4;
            --card: #ffffff;
            --line: #e4ece8;
            --danger: #e5484d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(700px 380px at 12% 0%, rgba(46, 224, 160, .22), transparent 60%),
                linear-gradient(160deg, #04150d 0%, #0b3b27 100%);
        }
        .card {
            width: min(420px, 100%);
            background: var(--card);
            border-radius: 22px;
            padding: 34px 30px;
            box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .45);
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2rem; }
        .logo {
            width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
            background: linear-gradient(135deg, #2fe0a0, #0c9a58);
        }
        h1 { font-size: 1.32rem; margin: 22px 0 6px; }
        p.hint { color: var(--muted); font-size: .88rem; margin: 0 0 22px; line-height: 1.7; }
        label { display: block; font-size: .82rem; font-weight: 700; margin-bottom: 7px; }
        input {
            width: 100%; padding: 13px 15px; font-size: .95rem; font-family: inherit;
            border: 1.5px solid var(--line); border-radius: 12px; background: #f7faf8; outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(18, 183, 106, .13); }
        .field { margin-bottom: 16px; }
        button {
            width: 100%; margin-top: 6px; padding: 13px 16px; border: 0; border-radius: 12px;
            font-size: .95rem; font-weight: 700; color: #fff; cursor: pointer; font-family: inherit;
            background: linear-gradient(135deg, #17c47a, var(--primary-strong));
            box-shadow: 0 12px 26px -12px rgba(18, 183, 106, .8);
        }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .msg { margin-top: 16px; font-size: .85rem; line-height: 1.7; display: none; }
        .msg.error { display: block; color: var(--danger); }
        .msg.ok { display: block; color: var(--primary-strong); }
        a.back { display: inline-block; margin-top: 18px; color: var(--muted); font-size: .82rem; text-decoration: none; }
        a.back:hover { color: var(--primary-strong); }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <span class="logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#04150d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21C7 17 3 13.5 3 8.7 3 6 5 4 7.5 4c1.5 0 3 .8 4.5 2.7C13.5 4.8 15 4 16.5 4 19 4 21 6 21 8.7c0 4.8-4 8.3-9 12.3z"/>
            </svg>
        </span>
        NutriAI
    </div>
    <h1>设置新密码</h1>
    <p class="hint">请输入两次相同的新密码（至少 6 位）。设置成功后即可用新密码登录。</p>
    <form id="resetForm" novalidate>
        <div class="field">
            <label for="pwd">新密码</label>
            <input id="pwd" type="password" minlength="6" maxlength="100" autocomplete="new-password" required>
        </div>
        <div class="field">
            <label for="pwd2">确认新密码</label>
            <input id="pwd2" type="password" minlength="6" maxlength="100" autocomplete="new-password" required>
        </div>
        <button id="submitBtn" type="submit">确认重置</button>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
    </form>
    <a class="back" href="/">← 返回 NutriAI</a>
</div>
<script>
    (function () {
        const token = new URLSearchParams(location.search).get('token') || '';
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');
        const form = document.getElementById('resetForm');

        function show(text, type) {
            msg.textContent = text;
            msg.className = 'msg ' + type;
        }

        if (!token) {
            show('链接缺少重置令牌，请重新从邮件打开，或返回首页重新申请。', 'error');
            btn.disabled = true;
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            const pwd = document.getElementById('pwd').value;
            const pwd2 = document.getElementById('pwd2').value;
            if (pwd.length < 6) return show('密码至少需要 6 个字符。', 'error');
            if (pwd !== pwd2) return show('两次输入的密码不一致。', 'error');
            btn.disabled = true;
            btn.textContent = '提交中…';
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: pwd })
                });
                const data = await res.json();
                if (res.ok && data.code === 200) {
                    show('✅ 密码重置成功，3 秒后跳转首页登录。', 'ok');
                    setTimeout(function () { location.href = '/'; }, 3000);
                } else {
                    show(data.message || '重置失败，请重新申请。', 'error');
                    btn.disabled = false;
                    btn.textContent = '确认重置';
                }
            } catch (err) {
                show('网络错误，请稍后重试。', 'error');
                btn.disabled = false;
                btn.textContent = '确认重置';
            }
        });
    })();
</script>
</body>
</html>
